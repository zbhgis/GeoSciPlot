# ─────────────────────────────────────────────────────────────
# GeoSciPlot 参考图库 · 子域 geosciplot.zbhgis.com
# 用法：复制到服务器 /etc/nginx/conf.d/geosciplot.conf
# 证书路径与主站 acme.sh 的安装位置一致（/etc/nginx/ssl/）
# ─────────────────────────────────────────────────────────────

# ─── HTTP：acme.sh 验证 + 跳转 HTTPS ───
server {
    listen 80;
    server_name geosciplot.zbhgis.com;

    # acme.sh 验证专用路径（webroot 模式）
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme/geosciplot; }

    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS：静态画廊 + 统计 API 反代 ───
server {
    listen 443 ssl;
    http2 on;
    server_name geosciplot.zbhgis.com;

    # 证书路径（与 acme.sh --install-cert 的安装位置一致，见操作手册）
    ssl_certificate     /etc/nginx/ssl/geosciplot.zbhgis.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/geosciplot.zbhgis.com.key;

    # next build（output: "export"）的 out/ 目录
    root /var/www/geosciplot;
    index index.html;

    # 统计/排行 API：反代到 FastAPI（浏览器视角同源，画廊站零 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态导出的兜底（详情页 /{id}/ 直达时落到自己的 index.html）
    location / { try_files $uri $uri/ /index.html; }

    # 图片长缓存（按日期分目录，内容不变）
    location ~* ^/images/.*\.(webp|png|jpe?g|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
