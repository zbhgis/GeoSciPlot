# ─────────────────────────────────────────────────────────────
# GeoSciPlot 参考图库 · 子域 geosciplot.zbhgis.com
# ─────────────────────────────────────────────────────────────

# ─── HTTP：acme.sh 验证 + 跳转 HTTPS ───
server {
    listen 80;
    server_name geosciplot.zbhgis.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme/geosciplot; }

    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS：静态画廊 + 统计 API 反代 ───
server {
    listen 443 ssl;
    server_name geosciplot.zbhgis.com;

    ssl_certificate     /etc/nginx/ssl/geosciplot.zbhgis.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/geosciplot.zbhgis.com.key;

    root /var/www/geosciplot;
    index index.html;

    # 安全响应头（location 内的 add_header 会覆盖继承，有自定义头的位置需重复声明）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    location ~* ^/images/.*\.(webp|png|jpe?g|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 静态资源：gallery.js / gallery-data.js 构建时带 ?v= 版本号，可长缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
