# ─────────────────────────────────────────────────────────────
# GeoSciPlot 参考图库 · 子域 geosciplot.zbhgis.com
# ─────────────────────────────────────────────────────────────

# ─── HTTP：acme.sh 验证 + 跳转 HTTPS ───
server {
    listen 80;
    server_name geosciplot.zbhgis.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme/geosciplot; }

    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS：静态画廊 + 统计 API 反代 ───
server {
    # http2：站内 4-6 个同源 JS/CSS 不再 HTTP/1.1 串行排队（listen 级写法
    # 兼容 1.9.5+ 全版本；nginx ≥1.25.1 会提示改用 http2 on，二者等价）
    listen 443 ssl http2;
    server_name geosciplot.zbhgis.com;

    ssl_certificate     /etc/nginx/ssl/geosciplot.zbhgis.com.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/geosciplot.zbhgis.com.key;

    root /var/www/geosciplot;
    index index.html;

    # HTML 里有 <meta charset>，但缺响应头 charset 时 text/html 不带参数，
    # 部分抓取端（旧爬虫、RSS 阅读器）会按默认编码解，中文变乱码。
    charset utf-8;

    # 安全响应头（location 内的 add_header 会覆盖继承，有自定义头的位置需重复声明）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML 与根目录文本（llms.txt / sitemap.xml）：发布后立即可见，但允许
    # 304 协商缓存（nginx 静态文件自带 Last-Modified/ETag，代价是一次往返）。
    # location 内 add_header 会覆盖继承，安全头需重复声明。
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # 图片独立持久目录（别名映射）：站点发布是整目录原子换台，几十 MB 图片不该
    # 随之反复上传。启用步骤（见 usage.md「源站图片」）：
    #   1) ssh root@服务器 mkdir -p /var/www/geosciplot-images
    #   2) scp -r images/thumb images/disp root@服务器:/var/www/geosciplot-images/
    #   3) 构建加 --origin-images（sources 首位插入同源 /images，jsDelivr/raw 仍作降级）
    # 未启用时此 location 404，页面图片照常走 jsDelivr → raw 降级链，互不影响。
    # 图片文件名由内容哈希派生、一经收录不再原地覆盖 → immutable 年缓存
    location ^~ /images/ {
        alias /var/www/geosciplot-images/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 静态资源：?v= 已改为按文件内容 hash（site_common.asset_ver），
    # 内容一变 URL 必变 → 放心 immutable 年缓存，没改的文件跨发布继续命中
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    gzip on;
    # 构建期为文本产物预生成了 .gz（assets/*.js|css、llms*.txt、sitemap.xml、
    # feed.xml），gzip_static 命中则零 CPU 直出；未命中回落动态压缩
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html 是 gzip 默认强制压缩的，不用列；要补的是下面三类纯文本：
    # llms.txt / llms-full.txt（AI 爬虫入口）与 sitemap.xml（搜索引擎入口）。
    # 实测未压缩时 sitemap.xml 143K、llms.txt 77K 是每次抓取都整份传输。
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml text/plain text/xml application/xml application/atom+xml;
}
